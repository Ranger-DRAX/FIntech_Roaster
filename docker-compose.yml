# ---- docker-compose.yml ----
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: upay-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: upay
      POSTGRES_USER: upay_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U upay_user -d upay" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: upay-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,upay-web
      DATABASE_URL: postgres://upay_user:${POSTGRES_PASSWORD:-changeme}@db:5432/upay
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
