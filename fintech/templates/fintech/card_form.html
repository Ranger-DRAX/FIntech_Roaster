{% extends "base.html" %}
{% block title %}{{ title }} - Fintech{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
            <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
            <a href="{% url 'fintech:card-list' %}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
